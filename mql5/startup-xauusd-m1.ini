; MetaTrader 5 startup configuration.
;
; Opens an XAUUSD M1 chart and attaches TgxmEmaRsiAtrDemo to it, so the chart
; and the Expert Advisor do not have to be set up by hand:
;
;   & "C:\Program Files\MetaTrader 5\terminal64.exe" /config:"<path to this file>"
;
; The terminal has to be closed first; it applies this section only at startup.
; Account credentials are deliberately absent - the terminal reconnects with the
; account it already has saved, and no login or password is ever written here.
[StartUp]
Symbol=XAUUSD
Period=M1
Expert=TgxmEmaRsiAtrDemo
